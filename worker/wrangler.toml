# CollectionHub sync: stores one encrypted snapshot per sync code. Deploy once: `npx wrangler deploy` in this folder.
name = "collectionhub-sync"
main = "sync.js"
compatibility_date = "2026-10-01"
workers_dev = true

# One Durable Object per sync code (free plan: SQLite-backed objects). Strongly consistent, so a save can safely say
# "replace version N" and be refused when another device saved first.
[[durable_objects.bindings]]
name = "BOX"
class_name = "SyncBox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncBox"]

# Requests per address, counted by Cloudflare at the edge (free). Reads are the quiet "did another device save?" checks;
# writes are saves and "Change code". Past the limit the app is told to wait a minute (429) and tries again by itself.
[[ratelimits]]
name = "READS"
namespace_id = "1001"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "WRITES"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
