# Checks every pull request and every push to main before it can go live: type check, unit tests, build,
# and the browser checks (e2e/, phone + tablet + desktop, Scryfall/EDHREC mocked).
name: CI
on:
  pull_request:
  push:
    branches: [main]
# Checks only read the code: the token GitHub hands them cannot push, comment or change settings (Phase 5E).
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
  screens:
    # Playwright 1.56 can't install Chromium on ubuntu-latest (26.04); 24.04 is supported.
    runs-on: ubuntu-24.04
    # The suite is ~560 checks across three screen sizes; at the runner's default of 2 workers it ran past 20 minutes
    # and was cancelled mid-run with everything passing (Nov 15-16). Three workers on a 4-core runner, 35 minutes.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        # The system packages come from Ubuntu's mirror. When the runner cannot reach it,
        # install the browser alone: the runner image already has what Chromium needs to start.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Browser checks
        run: npx playwright test --trace off --workers=3
      - name: Keep the report when a check fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
