# Checks every pull request and every push to main before it can go live: type check, unit tests, build,
# and the browser checks (e2e/, phone + tablet + desktop, Scryfall/EDHREC mocked).
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
  screens:
    # Playwright 1.56 can't install Chromium on ubuntu-latest (26.04); 24.04 is supported.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        # The system packages come from Ubuntu's mirror. When the runner cannot reach it,
        # install the browser alone: the runner image already has what Chromium needs to start.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Browser checks
        run: npx playwright test --trace off
      - name: Keep the report when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
