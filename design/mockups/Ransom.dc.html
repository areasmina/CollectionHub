<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ransom note letters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes jit{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-2px) rotate(1.5deg)}}
.jit{animation:jit 2.6s steps(2,end) infinite}
@media (prefers-reduced-motion: reduce){.jit{animation:none}}
</style>
</helmet>
<div aria-hidden="true" style="display: flex; flex-wrap: wrap; align-items: flex-end; row-gap: {{rowGap}}px; column-gap: {{wordGap}}px">
  <sc-for list="{{words}}" as="w" hint-placeholder-count="3">
    <span style="display: inline-flex; align-items: flex-end; flex-wrap: nowrap">
      <sc-for list="{{w.letters}}" as="l" hint-placeholder-count="4">
        <span style="display: inline-block; {{l.outer}}"><span class="jit" style="display: inline-block; {{l.inner}}">{{l.ch}}</span></span>
      </sc-for>
    </span>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"text":{"editor":"text","default":"WHAT CAN I BUILD?"},"size":{"editor":"int","default":84,"min":20,"max":160},"seed":{"editor":"int","default":3,"min":1,"max":99},"$preview":{"width":900,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    var text = this.props.text ?? 'WHAT CAN I BUILD?';
    var size = this.props.size ?? 84;
    var seed = this.props.seed ?? 3;
    var tex = 'radial-gradient(rgba(90,70,40,.13) 1px, transparent 1.4px) 0 0/3px 3px, ';
    var papers = {
      cream: { bg: tex + 'linear-gradient(172deg, #F4EFE1 0%, #E6DCC6 100%)', fg: '#111111' },
      black: { bg: 'radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.4px) 0 0/3px 3px, linear-gradient(172deg, #1C1C1C, #050505)', fg: '#F1EBDC' },
      yellow: { bg: tex + 'linear-gradient(172deg, #FFDB4D 0%, #F1C400 100%)', fg: '#111111' }
    };
    var fonts = [
      "'Alfa Slab One', serif", "'Alfa Slab One', serif", "'Alfa Slab One', serif",
      "'Archivo Black', sans-serif", "'Archivo Black', sans-serif",
      "'Playfair Display', serif; font-style: italic; font-weight: 900"
    ];
    var clips = [
      'polygon(1% 2%, 99% 0, 100% 97%, 0 100%)',
      'polygon(0 0, 98% 3%, 100% 100%, 2% 97%)',
      'polygon(2% 0, 100% 2%, 98% 98%, 0 100%)',
      'polygon(0 3%, 100% 0, 99% 100%, 1% 98%)'
    ];
    var rnd = function (n) { var x = Math.sin(n * 12.9898 + seed * 78.233) * 43758.5453; return x - Math.floor(x); };
    var last = 'cream';
    var k = 0;
    var words = text.split(' ').map(function (w) {
      return {
        letters: w.split('').map(function (ch) {
          k++;
          var r = rnd(k);
          var pk = r < 0.58 ? 'cream' : (r < 0.79 ? 'black' : 'yellow');
          if (pk !== 'cream' && pk === last) pk = 'cream';
          last = pk;
          var p = papers[pk];
          var font = fonts[Math.floor(rnd(k + 400) * fonts.length)];
          var fs = Math.round(size * (0.9 + rnd(k + 50) * 0.14));
          var rot = (rnd(k + 100) * 8 - 4).toFixed(1);
          var dy = Math.round(rnd(k + 150) * 8 - 4);
          var padX = Math.round(size * (0.12 + rnd(k + 200) * 0.05));
          var padY = Math.round(size * (0.07 + rnd(k + 250) * 0.04));
          var delay = (rnd(k + 300) * 2.4).toFixed(2);
          return {
            ch: ch,
            outer: 'margin: 0 ' + Math.round(size * 0.035) + 'px; transform: rotate(' + rot + 'deg) translateY(' + dy + 'px); filter: drop-shadow(2px 4px 0 rgba(0,0,0,.9))',
            inner: 'min-width: ' + Math.round(size * 0.62) + 'px; text-align: center; font-size: ' + fs + 'px; line-height: 1.05; padding: ' + padY + 'px ' + padX + 'px; background: ' + p.bg + '; color: ' + p.fg + '; font-family: ' + font + '; clip-path: ' + clips[Math.floor(rnd(k + 350) * clips.length)] + '; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), inset 0 -' + Math.round(size * 0.05) + 'px ' + Math.round(size * 0.08) + 'px rgba(0,0,0,.12); animation-delay: -' + delay + 's'
          };
        })
      };
    });
    return { words: words, wordGap: Math.round(size * 0.4), rowGap: Math.round(size * 0.16) };
  }
}
</script>
</body>
</html>
